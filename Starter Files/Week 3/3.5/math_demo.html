<!DOCTYPE html>
<html>
<head>
    <title>Math and DOM Practice</title>
</head>
<body>
    <h1>Math and DOM Practice</h1>
    <p>Your ECPI Student ID:Tevdon4603</p>
    <p id="randomNum"></p>
    <p id="squareRoot"></p>
    <p id="powerCalc"></p>
    <p id="roundedValue"></p>
    <button id="calculateBtn">Calculate</button>
    <script>
    document.getElementById('calculateBtn').addEventListener('click', function() {
        // Generate a random number and display it
        var randomNumber = Math.random();
        document.getElementById('randomNum').innerText = 'Random Number: ' + randomNumber;

        // Calculate the square root of 81 and display it
        var squareRoot = Math.sqrt(81);
        document.getElementById('squareRoot').innerText = 'Square Root of 81: ' + squareRoot;

        // Calculate 5 raised to the power of 3 and display it
        var powerCalc = Math.pow(5, 3);
        document.getElementById('powerCalc').innerText = '5 to the power of 3: ' + powerCalc;

        // Round the number 4.67 and display it
        var roundedValue = Math.round(4.67);
        document.getElementById('roundedValue').innerText = 'Rounded Value of 4.67: ' + roundedValue;
    });
</script>
</body>
</html>
