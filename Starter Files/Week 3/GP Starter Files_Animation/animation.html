<!DOCTYPE html>
<html>
<head>
    <!--
    Author: Tevin Donegan
    Date: 09/30026
    Purpose: To create a frame-by-frame animation using JavaScript by
             swapping out image files on a timer.
    -->
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>Animation</title>
</head>
<body>
    <h1>Tevdon4603, Animation</h1>
    <img id="imgJackhammer" src="jackhammer0.gif" width="113" height="100"
        alt="Image of a man with a jackhammer." /><br>
    <button onclick="startBouncing()">Start Bouncing</button>
    <script>
        // Declare and fill array with image file names
        var jackhammers = ["jackhammer0.gif", "jackhammer1.gif"
            , "jackhammer2.gif", "jackhammer3.gif", "jackhammer4.gif"
            , "jackhammer5.gif", "jackhammer6.gif", "jackhammer7.gif"
            , "jackhammer8.gif", "jackhammer9.gif", "jackhammer10.gif"];
        var curJackhammer = 0;
        // Swap out the images to create a movement effect
        function bounce() {
            curJackhammer = (curJackhammer === 10) ? 0 : ++curJackhammer;
            var imgHolder = document.getElementById("imgJackhammer");
            imgHolder.src = jackhammers[curJackhammer];
        }
        // Activate animation function
        function startBouncing() {
            setInterval(bounce, 90);
        }
    </script>
</body>
</html>
