<!DOCTYPE html>
<html lang="en">
<head>
    <!--
        Author: Tevin Donegan
        Date:   10/01/2026
        Purpose: To serve as the secondary pop-up window for the Pop-Up
                 exercise. It reads the table type ("addition" or
                 "multiplication") from the URL query string and dynamically
                 generates a math table from 0 to 10.
    -->
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math Table Display</title>
   

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 20px;
        }
        header {
            background: #04819E;
            color: white;
            padding: 15px;
            border-radius: 8px;
        }
        table {
            margin: 20px auto;
            border-collapse: collapse;
            font-size: 0.9em;
        }
        th, td {
            border: 1px solid #999999;
            padding: 4px 8px;
            min-width: 32px;
        }
        th {
            background: #e3d5ba;
        }
        td {
            background: #f9f9f9;
        }
        .header-row th {
            background: #04819E;
            color: white;
        }
    </style>
</head>
<body>
    <header>
        <h1 id="tableHeader">Math Table</h1>
    </header>

    <div id="tableContainer"></div>

    <script>
        /**
         * Reads a query-string parameter from the current URL.
         *
         * @param {string} name - The name of the parameter to look up.
         * @returns {string} The value of the parameter, or an empty string.
         */

          /** Built a style sheet to style the page and buttons for the pop-up window demonstration. */
        function getQueryParam(name) {
            var query = window.location.search.substring(1);
            var params = query.split("&");

            for (var i = 0; i < params.length; i++) {
                var pair = params[i].split("=");
                if (decodeURIComponent(pair[0]) === name) {
                    return decodeURIComponent(pair[1] || "");
                }
            }
            return "";
        }

        /**
         * Builds and displays the requested math table from 0 to 10.
         * If the type is "addition", cells show i + j.
         * If the type is "multiplication", cells show i * j.
         */
        function buildTable() {
            // Read the table type from the URL query string.
            var tableType = getQueryParam("type");

            // Set the header text and pick the operator based on the type.
            var headerText;
            var operator;

            if (tableType === "multiplication") {
                headerText = "Tevin Donegan  Multiplication Table";
                operator = "×";
            } else {
                // Default to addition if type is missing or unknown.
                headerText = "Tevin Dongean Addition Table";
                operator = "+";
            }

            // Update the page header.
            document.getElementById("tableHeader").textContent = headerText;

            // Start building the table as an HTML string.
            var html = "<table>";

            // Top header row: blank cell + column numbers 0–10.
            html += "<tr class='header-row'><th>" + operator + "</th>";
            for (var col = 0; col <= 10; col++) {
                html += "<th>" + col + "</th>";
            }
            html += "</tr>";

            // Body rows: row number + computed values.
            for (var i = 0; i <= 10; i++) {
                html += "<tr>";
                html += "<th>" + i + "</th>";

                for (var j = 0; j <= 10; j++) {
                    var value;
                    if (tableType === "multiplication") {
                        value = i * j;
                    } else {
                        value = i + j;
                    }
                    html += "<td>" + value + "</td>";
                }
                html += "</tr>";
            }

            html += "</table>";

            // Insert the completed table into the page.
            document.getElementById("tableContainer").innerHTML = html;
        }

        // Build the table once the page has loaded.
        window.addEventListener("load", buildTable);
    </script>
</body>
</html>
