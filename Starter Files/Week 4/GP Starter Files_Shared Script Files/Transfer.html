<!DOCTYPE html>
<html>
<head>
    <!--
    Author: Tevin Donegan
    Date: 10/01/2026
    Purpose: To create a greeting card form that sends user input to a
             preview page, demonstrating how a single JavaScript file can
             be shared between multiple HTML pages.
    -->
    <meta charset="utf-8" />
    <meta id="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=0">
    <title>Sharing Script Files</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="modernizr.custom.65897.js"></script>
</head>
<body>
    <header>
        <h1>
            TevDon4603, Sharing Script Files
        </h1>
    </header>

    <article>
        <h2>Create Greeting Card</h2>

        <form action="Preview.html">
            <fieldset id="info">
                <label for="greetinginput">Greeting Text</label>
                <input type="text" id="greetinginput" name="greeting" />
            </fieldset>

            <fieldset id="submitbutton">
                <input type="submit" id="submitBtn" value="Preview" />
            </fieldset>
        </form>
    </article>

    <script src="script.js"></script>
</body>
</html>
