<!DOCTYPE html>
<html lang="en">
<head>
    <!--
    Author: TevDon4603
    Date: 10/04/2026
    Purpose: Displays the trip summary generated by TripSummary.html. The
             summary data is read from session storage and displayed on the
             page when the window loads.
    -->
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trip Summary Results</title>
    <link rel="stylesheet" href="styles.css" />
</head>
<body>
    <header>
        <h1>
            TevDon4603, Trip Summary
        </h1>
    </header>

    <article>
        <h2>Trip Summary</h2>

        <p><strong>Trip Name:</strong> <span id="tripNameOut"></span></p>
        <p><strong>Total Miles Traveled:</strong> <span id="milesOut"></span></p>
        <p><strong>Gallons of Gas Consumed:</strong> <span id="gallonsOut"></span></p>
        <p><strong>Fuel Economy (MPG) for the Trip:</strong> <span id="mpgOut"></span></p>
        <p><strong>Date and Time Generated:</strong> <span id="dateTimeOut"></span></p>
    </article>

    <script src="TripResults.js"></script>
</body>
</html>
